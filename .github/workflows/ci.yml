name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: togetherings/kolibri-games
          path: kolibri-games
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Level tests
        run: node tests/test_levels.js
      - name: Check the game with kolibri-games-pack
        run: PYTHONPATH=kolibri-games python3 -m kolibri_games.pack --check game
      - name: Browser test
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tests/browser_test.py kolibri-games
